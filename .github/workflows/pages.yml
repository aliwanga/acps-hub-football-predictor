name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"        # refresh data and ratings every day at 03:00 UTC
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Download real match data
        run: python fetch_data.py
      - name: Train models
        run: python train.py
      - name: Export static site (refuses demo data)
        run: python export_static.py
      - name: Verify the browser engine matches Python
        run: node tools/verify_static.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
